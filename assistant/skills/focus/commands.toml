# Commands: the first command with a matching pattern wins (checked in this order).
# Patterns are regular expressions on the normalized phrase: lowercase, no punctuation, "ё" -> "е", no "Джарвис".
examples = ["помодоро", "помодоро на <N> минут", "останови помодоро", "сколько до перерыва"]

[[command]]
action = "stop"
patterns = [
    '\b(останови|выключи|отмени|заверши|закончи|стоп|хватит|прекрати|отключи|сбрось)\w*\s+(помодоро|pomodoro|помидор\w*|фокус\w*|рабоч\w+ сесси\w*|сесси\w* фокуса|таймер фокуса|режим фокуса)',
    '^(помодоро|фокус) (стоп|хватит|отмена|выключи)$',
]

[[command]]
action = "status"
patterns = [
    '(сколько (еще |мне )?(осталось|работать)|когда перерыв|статус)\s*.*(помодоро|pomodoro|помидор\w*|фокус\w*)',
    '^сколько до перерыва',
    '^когда (будет )?перерыв',
]

[[command]]
action = "start"
patterns = [
    '^(запусти|начни|включи|давай|старт|поставь|начинаем|погнали)?\s*(помодоро|pomodoro|помидор\w*|фокус\w*|рабоч\w+ сесси\w*|сесси\w* фокуса|таймер фокуса|режим фокуса)\b',
    '^(поработаем|давай поработаем|время работать) по помодоро',
    # "поставь работу на 50 минут", "поработаю 50 минут", "режим работы на час": a work session, not a plain timer
    '^(поставь|запусти|начни|включи|давай)\s+(работу|режим работы|рабочий режим|рабочий таймер)\s+на\s+',
    '^(поработаю|поработаем|буду работать|работаю|давай поработаем)\s+(\d+|час|полчаса|пол часа)',
]
