[skill]
id = "search"
name = "Поиск в браузере"
version = "1.0.0"
author = "Jarvis"
description = "Поиск в браузере: Яндекс, Google, YouTube, Википедия, карты, Маркет."
api = 1
entry = "main:create"
permissions = ["browser"]

[config]
default = "yandex"
engines = { "yandex" = "https://yandex.ru/search/?text={q}", "google" = "https://www.google.com/search?q={q}", "youtube" = "https://www.youtube.com/results?search_query={q}", "wiki" = "https://ru.wikipedia.org/w/index.php?search={q}", "maps" = "https://yandex.ru/maps/?text={q}", "market" = "https://market.yandex.ru/search?text={q}" }

[[settings]]
key = "default"
label = "Поисковик для «найди в браузере»"
type = "select"
options = [["yandex", "Яндекс"], ["google", "Google"]]
