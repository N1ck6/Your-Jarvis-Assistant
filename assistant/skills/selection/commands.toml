# Actions on the text selected in any window. All of it runs on the local model; the text never leaves the computer.
# The selection is copied with Ctrl+C, the clipboard is restored afterwards.
examples = ["переведи выделенное", "объясни выделенное", "перескажи выделенное", "исправь ошибки", "прочитай выделенное"]

[defaults]
source = "selection"
chain = "local"

[[command]]
action = "fix"
patterns = [
    '^(исправь|исправить|поправь)( (ошибки|опечатки|орфографию|грамматику|текст|пунктуацию))?( в)?( (это|эту|этот|вот это|выделенное|выделенный текст|выделенный фрагмент|выделение|что выделено|что я выделил|текст|этот текст|фрагмент|абзац))?$',
    '^проверь (ошибки|опечатки|орфографию|грамматику|пунктуацию)( в)?( (это|эту|этот|вот это|выделенное|выделенный текст|выделенный фрагмент|выделение|что выделено|что я выделил|текст|этот текст|фрагмент|абзац))?$',
]
prompt = "fix"
output = "replace"     # the selection is replaced in place
max_tokens = 2000
reply = "Готово."

[[command]]
action = "rewrite"
patterns = ['^(перепиши|переформулируй|сформулируй|перефразируй)( (это|эту|этот|вот это|выделенное|выделенный текст|выделенный фрагмент|выделение|что выделено|что я выделил|текст|этот текст|фрагмент|абзац))?( (официально|вежливо|короче|проще|понятнее|красивее|деловым стилем|по-деловому|дружелюбнее|формально|неформально))?$']
prompt = "rewrite"     # {style}: " (вежливо)" from the phrase, see main.py
output = "replace"
max_tokens = 2000
reply = "Готово."

[[command]]
action = "translate"
patterns = ['^(переведи|перевести|переводи|сделай перевод)( (это|эту|этот|вот это|выделенное|выделенный текст|выделенный фрагмент|выделение|что выделено|что я выделил|текст|этот текст|фрагмент|абзац))?( на (английский|русский|немецкий|французский|испанский|китайский|японский|украинский|английском|русском))?$']
prompt = "translate"   # {lang}: from the phrase, otherwise Russian <-> English by the text, see main.py
output = "clipboard"
title = "Перевод · {lang}"
max_tokens = 2000
speak_if = "to_russian"   # a short translation into Russian is also read aloud
speak_max = 400
reply = "Перевод на экране и в буфере обмена."
listen_after = false

[[command]]
action = "summary"
patterns = ['^(перескажи|сократи|кратко|суммаризируй|сделай выжимку|выжимку|резюмируй|о чем (это|тут|этот текст|текст|статья)|в двух словах)( (это|эту|этот|вот это|выделенное|выделенный текст|выделенный фрагмент|выделение|что выделено|что я выделил|текст|этот текст|фрагмент|абзац))?( кратко| коротко| в двух словах)?$']
prompt = "summary"
output = "speak"
max_tokens = 400

[[command]]
action = "read"
patterns = ['^(прочитай|прочти|зачитай|озвучь|прочитай вслух|читай)( мне)?( (это|эту|этот|вот это|выделенное|выделенный текст|выделенный фрагмент|выделение|что выделено|что я выделил|текст|этот текст|фрагмент|абзац))?( вслух)?$']
output = "read"        # the text itself, no model

[[command]]
action = "explain"
patterns = ['^(объясни|поясни|растолкуй|разъясни|что (это|тут) (значит|означает)|что значит (это|эту|этот|вот это|выделенное|выделенный текст|выделенный фрагмент|выделение|что выделено|что я выделил|текст|этот текст|фрагмент|абзац)|что это)( мне)?( (это|эту|этот|вот это|выделенное|выделенный текст|выделенный фрагмент|выделение|что выделено|что я выделил|текст|этот текст|фрагмент|абзац))?$']
prompt = "explain"
output = "speak"
max_tokens = 400
