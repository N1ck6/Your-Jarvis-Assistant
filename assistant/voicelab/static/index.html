<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Голос Джарвиса</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --text: #12161d; --muted: #5f6b7c; --line: #dfe3ea;
    --accent: #2458b8; --accent-soft: #e5ecf9; --good: #1f7a51; --good-soft: #e1f2e9;
    --shadow: 0 1px 2px rgba(15,25,40,.06), 0 4px 16px rgba(15,25,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0f14; --panel: #151a22; --text: #e6eaf1; --muted: #8b96a8; --line: #252c38;
      --accent: #6d9bf0; --accent-soft: #1a2740; --good: #4cc38a; --good-soft: #14302a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.2px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  h2 { font-size: 18px; margin: 28px 0 10px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
  textarea { width: 100%; min-height: 70px; resize: vertical; border-radius: 10px; border: 1px solid var(--line);
             background: var(--bg); color: var(--text); padding: 10px 12px; font: inherit; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 5px 12px;
          font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip.playing { border-color: var(--accent); background: var(--accent-soft); }
  .chip small { color: var(--muted); }
  label.inline { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
  input[type=range] { accent-color: var(--accent); width: 140px; }
  .btn { border: none; border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn:disabled { opacity: .55; cursor: default; }
  .metrics { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--good-soft); color: var(--good); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { display: flex; flex-direction: column; gap: 10px; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .card h3 { margin: 0; font-size: 16px; }
  .card p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .reactions { display: flex; flex-wrap: wrap; gap: 6px; }
  .actions { margin-top: auto; }
  ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; transition: .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<main>
  <h1>Голос Джарвиса</h1>
  <p class="sub">Ответы озвучивает синтезированный голос. Короткие реакции — «Слушаю, сэр», «Слушаюсь, сэр», «Всегда к вашим услугам» —
    звучат записями оригинального Джарвиса из проекта Хауди Хо.</p>

  <h2>Синтезированный голос</h2>
  <section class="panel">
    <div class="row" style="margin-top:0">
      <b id="voiceTitle">Silero · Евгений</b><span class="badge">Офлайн</span>
      <span class="metrics" id="synthMetrics"></span>
    </div>
    <ul id="voiceNotes"></ul>
    <div class="row"><textarea id="text"></textarea></div>
    <div class="row" id="presets"></div>
    <div class="row">
      <label class="inline">Скорость речи <input type="range" id="rate" min="0.8" max="1.3" step="0.05" value="1"> <span id="rateVal">1.00</span></label>
      <span style="flex:1"></span>
      <button class="btn ghost" id="speak">▶ Прослушать</button>
      <button class="btn primary" id="saveRate">Сохранить скорость</button>
    </div>
  </section>

  <h2>Реплики Джарвиса</h2>
  <div class="grid" id="packs"></div>
</main>
<div class="toast" id="toast"></div>

<script>
const PRESETS = {
  "Короткий ответ": "Сейчас в Москве плюс двенадцать градусов, облачно. К вечеру возможен дождь, сэр.",
  "Таймер": "Хорошо, через пятнадцать минут напомню: выключить плиту.",
  "Объяснение": "Оперативная память — это рабочий стол, а диск — шкаф. На столе всё под рукой, но места мало.",
  "Числа": "Курс доллара — 92 рубля 40 копеек, биткоин подорожал на 3,5%.",
};
const $ = (id) => document.getElementById(id);
const state = { pack: "", packs: [], audio: null, playingChip: null };

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}

async function playUrl(url, init) {
  if (state.audio) state.audio.pause();
  const r = await fetch(url, init);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  const blob = await r.blob();
  const src = URL.createObjectURL(blob);
  state.audio = new Audio(src);
  await state.audio.play();
  await new Promise(res => { state.audio.onended = res; state.audio.onpause = res; });
  URL.revokeObjectURL(src);
  return r;
}

async function speak() {
  $("synthMetrics").textContent = "синтез…";
  try {
    const t0 = performance.now();
    const r = await fetch("/api/synth", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: $("text").value, rate: +$("rate").value }) });
    const ms = r.headers.get("X-Synth-Ms"), sec = +r.headers.get("X-Audio-Sec");
    $("synthMetrics").textContent = `синтез ${ms} мс · звук ${sec.toFixed(1)} с`;
    const src = URL.createObjectURL(await r.blob());
    if (state.audio) state.audio.pause();
    state.audio = new Audio(src); await state.audio.play();
  } catch (e) { $("synthMetrics").textContent = "Ошибка: " + e.message; }
}

function renderPacks() {
  const box = $("packs"); box.innerHTML = "";
  const all = [...state.packs, { id: "none", title: "Без реплик — только синтезированный голос и короткие сигналы", reactions: [] }];
  for (const p of all) {
    const card = document.createElement("div");
    card.className = "panel card" + (p.id === state.pack ? " selected" : "");
    const [name, ...rest] = p.title.split(" — ");
    card.innerHTML = `<h3>${name}</h3><p>${rest.join(" — ")}</p><div class="reactions"></div>
      <div class="actions"><button class="btn primary" ${p.id === state.pack ? "disabled" : ""}>${p.id === state.pack ? "Используется" : "Выбрать"}</button></div>`;
    const reactions = card.querySelector(".reactions");
    for (const r of p.reactions) {
      for (let i = 0; i < r.count; i++) {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.innerHTML = r.count > 1 ? `${r.title} <small>${i + 1}</small>` : r.title;
        chip.onclick = async () => {
          document.querySelectorAll(".chip.playing").forEach(c => c.classList.remove("playing"));
          chip.classList.add("playing");
          try { await playUrl(`/api/clip/${p.id}/${r.key}/${i}`); } catch (e) { toast(e.message); }
          chip.classList.remove("playing");
        };
        reactions.appendChild(chip);
      }
    }
    card.querySelector(".btn").onclick = () => select(p.id);
    box.appendChild(card);
  }
}

async function select(packId) {
  const r = await fetch("/api/select", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pack: packId, rate: +$("rate").value }) });
  if (!r.ok) { toast("Не удалось сохранить"); return; }
  state.pack = (await r.json()).pack;
  renderPacks();
  toast("Сохранено — Джарвис уже использует этот выбор");
}

async function init() {
  const box = $("presets");
  for (const [name, text] of Object.entries(PRESETS)) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = name; b.onclick = () => { $("text").value = text; };
    box.appendChild(b);
  }
  $("text").value = PRESETS["Короткий ответ"];
  const data = await (await fetch("/api/state")).json();
  state.pack = data.pack; state.packs = data.packs;
  $("voiceTitle").textContent = data.voice.title;
  $("voiceNotes").innerHTML = [...data.voice.pros, ...data.voice.cons].map(x => `<li>${x}</li>`).join("");
  $("rate").value = data.rate; $("rateVal").textContent = (+data.rate).toFixed(2);
  $("rate").oninput = () => { $("rateVal").textContent = (+$("rate").value).toFixed(2); };
  $("speak").onclick = speak;
  $("saveRate").onclick = () => select(state.pack);
  renderPacks();
}
init();
</script>
</body>
</html>
