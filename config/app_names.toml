# Как называют программы и игры вслух -> как они называются на самом деле.
#
# Распознавание речи пишет английские названия русскими буквами («дискорд», «фотошоп», «вэ эс код»), а программы в
# меню «Пуск» называются по-английски. Этот словарь переводит одно в другое. Его используют «открой …», «закрой …»,
# «переключись на …», «сделай … тише».
#
# Свои названия добавляйте в data/app_names.toml (тот же формат, раздел [names]): он не перезаписывается обновлениями
# и важнее этого файла. Слева — как вы говорите (маленькими буквами, «е» вместо «ё»), справа — название программы
# в меню «Пуск» (регистр не важен, точное совпадение не нужно). Несколько вариантов произношения — несколько строк.

