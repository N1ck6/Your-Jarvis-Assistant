# Мои сценарии: фраза -> набор действий. Файл перечитывается автоматически, перезапуск не нужен.
# Рабочая копия: data/scenarios.toml (трей -> «Мои сценарии…»).
#
# Шаги (выполняются по порядку):
#   { open = "телеграм" }                     приложение по названию, путь к .exe/.lnk или ссылка steam://...
#   { url = "https://..." }                   сайт в браузере
#   { close = "браузер" }                     закрыть приложение
#   { say = "текст" }                         сказать фразу
#   { reaction = "ok" }                       реплика Джарвиса: ok, reply, thanks, joke, game_mode
#   { wait = 2 }                              пауза, секунды
#   { timer = 25, label = "перерыв" }         таймер на N минут
#   { media = "play_pause" }                  play_pause, next, prev, mute, unmute, vol_up, vol_down (+ times = 5)
#   { music = "название трека" }              музыка из папки ("" = вперемешку)
#   { search = "запрос", engine = "yandex" }  поиск в браузере
#   { minimize_all = true }                   свернуть все окна
#   { command = "доброе утро" }               любая другая команда Джарвиса
#
# phrases — как вы это говорите (после «Джарвис»). say — ответ; без него короткое «Слушаюсь, сэр».

[[scenario]]
name = "Режим фокуса"
phrases = ["режим фокуса", "включи режим фокуса", "включи фокус", "фокус", "открой фокус", "хочу поработать",
           "время работать", "давай работать", "рабочий режим"]
say = "Режим фокуса, сэр. Не отвлекаю."
steps = [
    { minimize_all = true },
    { command = "помодоро" },
    # { open = "steam://rungameid/3511030" },   # или своё приложение: Steam-игра, путь к .exe, название
]

[[scenario]]
name = "Игровой режим"
phrases = ["игровой режим", "режим игры", "давай поиграем", "время игр"]
steps = [
    { reaction = "game_mode" },
    { minimize_all = true },
    { open = "steam" },
]

